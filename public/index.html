<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoRadar</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e3e6eb; --text: #16181d; --muted: #6b7280;
    --accent: #2563eb; --warn: #b45309; --warn-bg: #fef3c7; --bad: #b91c1c; --bad-bg: #fee2e2;
    --info: #1d4ed8; --info-bg: #dbeafe; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #272b35; --text: #e6e8ec; --muted: #8b93a1;
      --accent: #60a5fa; --warn: #fbbf24; --warn-bg: #3a2c0b; --bad: #f87171; --bad-bg: #3b1414;
      --info: #93c5fd; --info-bg: #13243f; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 7px; padding: 6px 12px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  .progress { margin-top: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .progress .path { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 8px; }
  .bar::after { content: ""; display: block; width: 30%; height: 100%; background: var(--accent); animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; opacity: .5; } }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 16px 0; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .tile small { color: var(--muted); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .chip { border-radius: 999px; padding: 4px 12px; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip .n { opacity: .65; margin-left: 4px; font-variant-numeric: tabular-nums; }
  input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); min-width: 220px; flex: 0 1 280px; margin-left: auto; }
  .table { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; user-select: none; }
  th[data-sort] { cursor: pointer; }
  th[data-sort]:hover { color: var(--text); }
  th .arrow { margin-left: 4px; }
  td .sub { color: var(--muted); font-size: 12.5px; }
  .name { font-weight: 600; }
  .path { word-break: break-all; }
  .msg { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge { display: inline-block; border-radius: 5px; padding: 1px 7px; font-size: 12px; font-weight: 500; margin: 1px 4px 1px 0; white-space: nowrap; }
  .b-warn { background: var(--warn-bg); color: var(--warn); }
  .b-bad { background: var(--bad-bg); color: var(--bad); }
  .b-info { background: var(--info-bg); color: var(--info); }
  .muted { color: var(--muted); }
  .actions { white-space: nowrap; }
  .actions button { padding: 3px 9px; font-size: 12.5px; }
  button.mini { padding: 0 6px; font-size: 12px; margin-left: 6px; }
  button.mini:hover { border-color: var(--bad); color: var(--bad); }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Repo<span>Radar</span></h1>
    <div class="meta" id="meta"></div>
    <div class="spacer"></div>
    <button class="primary" id="rescan">Rescan</button>
  </header>

  <div class="progress" id="progress" hidden>
    <div><b id="pcount">0</b> folders scanned · <b id="prepos">0</b> repos so far</div>
    <div class="path mono" id="ppath"></div>
    <div class="bar"></div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="controls">
    <div id="filters" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    <input type="search" id="q" placeholder="Filter by name or path…" aria-label="Filter repos">
  </div>

  <div class="table">
    <table>
      <thead><tr>
        <th data-sort="name">Repository</th>
        <th>Branch</th>
        <th data-sort="age">Last commit</th>
        <th data-sort="changes">Uncommitted</th>
        <th data-sort="branches">Unpushed / local-only</th>
        <th data-sort="nm">Build folders</th>
        <th></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const STALE_DAYS = 30;
const DAY = 864e5;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let data = null;
let filter = 'attention';
let sort = { key: 'age', dir: -1 }; // dir 1 = ascending; age desc = oldest first
let q = '';

const buildBytes = r => r.buildDirs.reduce((s, d) => s + d.bytes, 0);
const ageDays = r => {
  const t = r.lastCommit?.at ?? Math.max(0, ...r.buildDirs.map(d => d.modified));
  return t ? (Date.now() - t) / DAY : Infinity;
};
const flags = r => ({
  dirty: r.changes > 0,
  unpushed: r.unpushed.length > 0,
  local: r.localOnly.length > 0 || !r.hasRemote,
  stash: r.stashes > 0,
  stale: r.buildDirs.length > 0 && ageDays(r) > STALE_DAYS,
});
const FILTERS = [
  ['attention', 'Needs attention', f => f.dirty || f.unpushed || f.local || f.stash],
  ['dirty', 'Uncommitted', f => f.dirty],
  ['stash', 'Stashed', f => f.stash],
  ['unpushed', 'Unpushed', f => f.unpushed],
  ['local', 'Local-only', f => f.local],
  ['stale', 'Stale build folders', f => f.stale],
  ['all', 'All', () => true],
];
const SORTS = {
  name: r => r.name.toLowerCase(),
  age: ageDays,
  changes: r => r.changes ?? -1,
  branches: r => r.localOnly.length + r.unpushed.length + (r.hasRemote ? 0 : 1),
  nm: buildBytes,
};

function bytes(n) {
  if (n == null) return '';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(n < 10 && i ? 1 : 0)} ${u[i]}`;
}
function ago(t) {
  if (!t) return '';
  const d = (Date.now() - t) / DAY;
  if (d < 1 / 24) return 'just now';
  if (d < 1) return `${Math.round(d * 24)}h ago`;
  if (d < 45) return `${Math.round(d)}d ago`;
  if (d < 365) return `${Math.round(d / 30)} mo ago`;
  return `${(d / 365).toFixed(1)} yr ago`;
}

function render() {
  if (!data) return;
  const hidden = new Set(data.ignored);
  const hiddenRepos = data.repos.filter(r => hidden.has(r.path));
  const repos = data.repos.filter(r => !hidden.has(r.path));
  const withFlags = repos.map(r => [r, flags(r)]);

  // meta + progress
  $('meta').textContent = `${data.drives.join('  ')}` + (data.finishedAt && !data.scanning ? ` · scanned ${ago(data.finishedAt)}` : '');
  $('progress').hidden = !data.scanning;
  $('rescan').disabled = data.scanning;
  $('rescan').textContent = data.scanning ? 'Scanning…' : 'Rescan';
  $('pcount').textContent = data.dirsScanned.toLocaleString();
  $('prepos').textContent = (data.found ?? 0).toLocaleString();
  $('ppath').textContent = data.current;

  // tiles
  const count = fn => withFlags.filter(([, f]) => fn(f)).length;
  const staleNm = withFlags.filter(([, f]) => f.stale);
  const staleBytes = staleNm.reduce((s, [r]) => s + buildBytes(r), 0);
  const allNm = repos.reduce((s, r) => s + buildBytes(r), 0);
  $('tiles').innerHTML = [
    [repos.length, 'repositories'],
    [count(f => f.dirty), 'with uncommitted changes'],
    [count(f => f.unpushed), 'with unpushed commits'],
    [count(f => f.local), 'with local-only branches'],
    [count(f => f.stash), 'with stashed changes'],
    [bytes(staleBytes) || '0 B', `in build folders of ${staleNm.length} stale repos (of ${bytes(allNm) || '0 B'})`],
  ].map(([v, l]) => `<div class="tile"><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join('');

  // filter chips
  $('filters').innerHTML = FILTERS.map(([k, label, fn]) =>
    `<button class="chip" data-filter="${k}" aria-pressed="${k === filter}">${label}<span class="n">${count(fn)}</span></button>`).join('')
    + `<button class="chip" data-filter="hidden" aria-pressed="${filter === 'hidden'}">Hidden<span class="n">${hiddenRepos.length}</span></button>`;

  // sort arrows
  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.querySelector('.arrow')?.remove();
    if (th.dataset.sort === sort.key) th.insertAdjacentHTML('beforeend', `<span class="arrow">${sort.dir > 0 ? '↑' : '↓'}</span>`);
  });

  // rows
  const showHidden = filter === 'hidden';
  const fn = showHidden ? () => true : FILTERS.find(([k]) => k === filter)[2];
  const needle = q.toLowerCase();
  const key = SORTS[sort.key];
  const rows = (showHidden ? hiddenRepos.map(r => [r, flags(r)]) : withFlags)
    .filter(([r, f]) => fn(f) && (!needle || r.path.toLowerCase().includes(needle)))
    .sort(([a], [b]) => {
      const x = key(a), y = key(b);
      return (x < y ? -1 : x > y ? 1 : 0) * sort.dir;
    });

  $('rows').innerHTML = rows.length ? rows.map(([r, f]) => `
    <tr>
      <td><div class="name">${esc(r.name)}</div><div class="sub mono path">${esc(r.path)}</div></td>
      <td><span class="mono">${esc(r.branch ?? '—')}</span>${r.hasRemote ? '' : '<div><span class="badge b-bad">no remote</span></div>'}</td>
      <td title="${r.lastCommit ? esc(new Date(r.lastCommit.at).toLocaleString()) : ''}">
        ${r.lastCommit ? `<div class="num">${ago(r.lastCommit.at)}</div><div class="sub msg" title="${esc(r.lastCommit.message)}">${esc(r.lastCommit.message)}</div>` : '<span class="muted">no commits</span>'}
      </td>
      <td class="num">${r.changes == null ? '<span class="muted">error</span>'
        : f.dirty ? `<span class="badge b-warn">${r.changes} file${r.changes === 1 ? '' : 's'}</span>${r.untracked ? `<div class="sub">${r.untracked} untracked</div>` : ''}${
          r.changedAt ? `<div class="sub" title="Newest change: ${esc(new Date(r.changedAt).toLocaleString())}">last edit ${ago(r.changedAt)}</div>` : ''}`
        : '<span class="muted">clean</span>'}${
        f.stash ? `<div><span class="badge b-info" title="git stash list">${r.stashes} stash${r.stashes === 1 ? '' : 'es'}</span></div>` : ''}</td>
      <td>${r.unpushed.map(b => `<span class="badge b-info mono" title="${b.ahead} commit(s) not pushed">${esc(b.name)} ↑${b.ahead}</span>`).join('')}${
        r.localOnly.map(n => `<span class="badge b-bad mono" title="No upstream branch">${esc(n)}</span>`).join('')}${
        !f.unpushed && !r.localOnly.length ? '<span class="muted">—</span>' : ''}</td>
      <td class="num">${r.buildDirs.length ? r.buildDirs.map(d => `<div><span class="mono">${esc(d.name)}</span> ${bytes(d.bytes)}${
        f.stale ? ' <span class="badge b-warn">stale</span>' : ''}<button class="mini" data-clean="${esc(d.name)}" data-path="${esc(r.path)}" data-size="${bytes(d.bytes)}">Delete</button></div>`).join('')
        : '<span class="muted">—</span>'}</td>
      <td class="actions">
        <button data-open="${esc(r.path)}">Open</button>
        <button data-code="${esc(r.path)}">VS Code</button>
        <button data-refresh="${esc(r.path)}" title="Re-check just this repo">Refresh</button>
        <button data-copy="${esc(r.path)}">Copy path</button>
        <button data-hide="${esc(r.path)}" data-hidden="${showHidden}">${showHidden ? 'Unhide' : 'Hide'}</button>
      </td>
    </tr>`).join('')
    : `<tr><td colspan="7" class="empty">${data.scanning && !repos.length ? 'Looking for repositories…' : 'Nothing here. Nice.'}</td></tr>`;
}

async function poll() {
  try { data = await (await fetch('/api/state')).json(); render(); } catch {}
  if (!data || data.scanning) setTimeout(poll, 1000);
}

const post = (url, body) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) });

$('rescan').onclick = async () => { await post('/api/scan'); poll(); };
$('q').oninput = e => { q = e.target.value; render(); };
$('filters').onclick = e => { const b = e.target.closest('[data-filter]'); if (b) { filter = b.dataset.filter; render(); } };
document.querySelector('thead').onclick = e => {
  const th = e.target.closest('th[data-sort]');
  if (!th) return;
  sort = th.dataset.sort === sort.key ? { key: sort.key, dir: -sort.dir } : { key: th.dataset.sort, dir: th.dataset.sort === 'name' ? 1 : -1 };
  render();
};
$('rows').onclick = async e => {
  const open = e.target.closest('[data-open]');
  const copy = e.target.closest('[data-copy]');
  const hide = e.target.closest('[data-hide]');
  const code = e.target.closest('[data-code]');
  const refresh = e.target.closest('[data-refresh]');
  const clean = e.target.closest('[data-clean]');
  if (open) post('/api/open', { path: open.dataset.open });
  if (code) {
    const res = await post('/api/code', { path: code.dataset.code });
    if (!res.ok) alert((await res.json()).error);
  }
  if (refresh) {
    refresh.disabled = true;
    refresh.textContent = 'Checking…';
    await post('/api/refresh', { path: refresh.dataset.refresh });
    poll();
  }
  if (clean) {
    const { path, clean: name, size } = clean.dataset;
    if (!confirm(`Permanently delete ${name} (${size}) in\n${path}?\n\nThis cannot be undone; reinstall or rebuild to get it back.`)) return;
    clean.disabled = true;
    clean.textContent = 'Deleting…';
    const res = await post('/api/clean', { path, name });
    if (!res.ok) alert((await res.json()).error);
    poll();
  }
  if (hide) {
    const res = await post('/api/ignore', { path: hide.dataset.hide, hide: hide.dataset.hidden !== 'true' });
    if (res.ok) { data.ignored = (await res.json()).ignored; render(); }
  }
  if (copy) {
    await navigator.clipboard.writeText(copy.dataset.copy).catch(() => {});
    copy.textContent = 'Copied';
    setTimeout(() => { copy.textContent = 'Copy path'; }, 1200);
  }
};
setInterval(() => !data?.scanning && render(), 60_000); // keep "x ago" fresh
poll();
</script>
</body>
</html>
