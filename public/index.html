<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoRadar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --paper: #f3efe6; --shade: #e9e3d6; --rule: #cfc7b6; --ink: #1d1a16; --muted: #6f675a; --faint: #8c8374;
    --rust: #a8411b; --green: #4a6b3a;
    --serif: "Source Serif 4", Charter, "Iowan Old Style", Georgia, serif;
    --mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1c1a17; --shade: #25221e; --rule: #3d3832; --ink: #ebe5d8; --muted: #a59d8f; --faint: #7f786c;
      --rust: #e0805a; --green: #9cb987;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.45 var(--serif); font-optical-sizing: auto; accent-color: var(--rust); }
  ::selection { background: var(--rust); color: var(--paper); }
  :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 28px 24px 64px; }

  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 3px double var(--ink); }
  h1 { font-size: 30px; font-weight: 650; margin: 0; letter-spacing: -.02em; }
  .meta { color: var(--muted); font-size: 14px; font-style: italic; }
  .spacer { flex: 1; }

  button { font: inherit; cursor: pointer; color: var(--ink); background: none; border: 0; padding: 0; }
  button:disabled { color: var(--faint); cursor: default; }
  #rescan { font-size: 14px; border: 1px solid var(--ink); padding: 5px 16px; }
  #rescan:hover:not(:disabled) { background: var(--ink); color: var(--paper); }
  #rescan:disabled { border-color: var(--rule); }

  .progress { padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 14px; font-style: italic; }
  .progress b { font-style: normal; font-variant-numeric: tabular-nums; }
  .progress .path { color: var(--muted); font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  .summary { display: flex; align-items: baseline; justify-content: space-between; gap: 8px 24px; flex-wrap: wrap; margin: 22px 0 18px; }
  .summary .head { font-size: 24px; letter-spacing: -.01em; }
  .summary .head b { font-weight: 650; font-variant-numeric: lining-nums tabular-nums; }
  .summary .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .summary .aside { text-align: right; }
  .summary .link { font-size: inherit; margin: 0; color: var(--ink); text-decoration-color: var(--rule); }
  .summary .link:hover { text-decoration-color: var(--rust); }
  .notice { margin: 0 0 10px; padding: 8px 0; color: var(--rust); font-style: italic; font-size: 14px; border-bottom: 1px dotted var(--rule); }

  .controls { display: flex; gap: 12px 24px; flex-wrap: wrap; align-items: baseline; padding-bottom: 8px; }
  #filters { display: flex; gap: 6px 20px; flex-wrap: wrap; }
  .chip { font-size: 14px; color: var(--muted); padding: 2px 0; border-bottom: 2px solid transparent; }
  .chip:hover { color: var(--ink); }
  .chip.zero { color: var(--faint); }
  .chip[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--rust); }
  .chip .n { margin-left: 5px; font-variant-numeric: lining-nums tabular-nums; }
  input[type=search] { font: italic 14px var(--serif); padding: 3px 0; border: 0; border-bottom: 1px solid var(--rule); background: none; color: var(--ink); min-width: 200px; flex: 0 1 260px; margin-left: auto; border-radius: 0; }
  input[type=search]::placeholder { color: var(--muted); }
  input[type=search]:focus-visible { outline: 0; border-bottom-color: var(--ink); }

  .table { border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 14px 11px 0; vertical-align: top; }
  td { border-top: 1px dotted var(--rule); }
  th { font-size: 13.5px; font-weight: 400; font-style: italic; color: var(--muted); white-space: nowrap; user-select: none; padding-top: 8px; padding-bottom: 8px; position: sticky; top: 0; z-index: 1; background: var(--paper); box-shadow: inset 0 -1px 0 var(--ink); }
  th:first-child { min-width: 220px; padding-left: 4px; }
  th.wrap-th { white-space: normal; min-width: 90px; }
  th[data-sort] { cursor: pointer; }
  th[data-sort]:hover, th[aria-sort] { color: var(--ink); }
  th .arrow { margin-left: 4px; font-style: normal; color: var(--rust); }
  tbody tr:first-child td { border-top: 0; }
  tbody tr:hover td:not(.empty) { background: var(--shade); }
  td:first-child { padding-left: 4px; }
  td .sub { color: var(--muted); font-size: 13.5px; }
  td .sub.mono { font-size: 12px; }
  .name { font-weight: 600; font-size: 16px; }
  .branch { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 8px; white-space: nowrap; }
  .name .b-bad { font-weight: 400; font-size: 13.5px; margin-left: 8px; }
  .actions { text-align: right; white-space: nowrap; padding-right: 4px; }
  .actions .link { margin: 0 0 0 14px; }
  tbody tr:not(:hover):not(:focus-within) .actions .link { color: var(--faint); }
  .path { overflow-wrap: anywhere; margin-top: 1px; }
  .msg { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; }
  .num { font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
  .badge { white-space: nowrap; margin-right: 10px; }
  .b-warn { color: var(--rust); font-weight: 600; }
  .b-bad { color: var(--rust); }
  .b-bad:not(.mono) { font-style: italic; }
  .b-info { color: var(--ink); }
  .muted { color: var(--faint); font-style: italic; }
  .link { font-size: 13.5px; color: var(--muted); margin-left: 12px; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; transition: color .15s, text-decoration-color .15s; }
  .link:hover:not(:disabled) { color: var(--ink); text-decoration-color: currentColor; }
  .link.danger:hover:not(:disabled) { color: var(--rust); }
  .empty { padding: 36px 4px; font-style: italic; color: var(--muted); }
  .empty b { display: block; font-style: normal; font-weight: 600; color: var(--ink); font-size: 17px; margin-bottom: 2px; }
  .empty .link { margin: 12px 0 0; font-style: normal; font-size: 14px; color: var(--ink); text-decoration-color: var(--rust); }
  @media (max-width: 1180px) {
    .wrap { padding: 20px 16px 48px; }
    .summary .aside { text-align: left; }
    input[type=search] { margin-left: 0; flex: 1 1 100%; }
    table, thead, tbody, td { display: block; }
    thead tr { display: flex; flex-wrap: wrap; gap: 2px 16px; padding: 6px 4px; box-shadow: inset 0 -1px 0 var(--ink); }
    thead tr::before { content: "Sort by"; font-style: italic; color: var(--faint); font-size: 13.5px; padding: 2px 0; }
    th { position: static; box-shadow: none; padding: 2px 0; min-width: 0 !important; background: none; }
    th:first-child { padding-left: 0; }
    tbody tr { display: block; padding: 12px 4px; border-top: 1px dotted var(--rule); }
    tbody tr:first-child { border-top: 0; }
    tbody tr:hover td:not(.empty) { background: none; }
    td { border: 0; padding: 2px 0; }
    td:first-child { padding: 0 0 4px; }
    td[data-label] { display: grid; grid-template-columns: 112px minmax(0, 1fr); justify-items: start; }
    td[data-label]::before { content: attr(data-label); grid-row: span 9; font-style: italic; color: var(--muted); font-size: 13.5px; }
    td[data-label] > * { grid-column: 2; }
    td.nil { display: none; }
    td.actions { text-align: left; padding-top: 8px; }
    .actions .link { margin: 0 16px 0 0; }
    tbody tr:not(:hover):not(:focus-within) .actions .link { color: var(--muted); }
    .msg { max-width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RepoRadar</h1>
    <div class="meta" id="meta"></div>
    <div class="spacer"></div>
    <button id="rescan">Rescan</button>
  </header>

  <div class="progress" id="progress" hidden>
    <div>Scanning… <b id="pcount">0</b> folders, <b id="prepos">0</b> repos so far</div>
    <div class="path mono" id="ppath"></div>
  </div>

  <div class="summary" id="summary"><div class="head" style="color:var(--muted)">Reading the last scan…</div></div>

  <div class="controls">
    <div id="filters"></div>
    <input type="search" id="q" placeholder="Filter by name or path  ( / )" aria-label="Filter repos">
  </div>

  <div class="notice" id="notice" role="status" hidden></div>

  <div class="table">
    <table>
      <thead><tr>
        <th data-sort="name" tabindex="0">Repository</th>
        <th data-sort="age" tabindex="0">Last commit</th>
        <th data-sort="changes" tabindex="0">Uncommitted</th>
        <th data-sort="branches" tabindex="0" class="wrap-th">Unpushed / local-only</th>
        <th data-sort="nm" tabindex="0">Build folders</th>
        <th aria-label="Actions"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const STALE_DAYS = 30;
const DAY = 864e5;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let data = null;
let filter = 'attention';
let sort = { key: 'age', dir: -1 }; // dir 1 = ascending; age desc = oldest first
let q = '';

const buildBytes = r => r.buildDirs.reduce((s, d) => s + d.bytes, 0);
const ageDays = r => {
  const t = r.lastCommit?.at ?? Math.max(0, ...r.buildDirs.map(d => d.modified));
  return t ? (Date.now() - t) / DAY : Infinity;
};
const flags = r => ({
  dirty: r.changes > 0,
  unpushed: r.unpushed.length > 0,
  local: r.localOnly.length > 0 || !r.hasRemote,
  stash: r.stashes > 0,
  stale: r.buildDirs.length > 0 && ageDays(r) > STALE_DAYS,
});
const FILTERS = [
  ['attention', 'Needs attention', f => f.dirty || f.unpushed || f.local || f.stash],
  ['dirty', 'Uncommitted', f => f.dirty],
  ['stash', 'Stashed', f => f.stash],
  ['unpushed', 'Unpushed', f => f.unpushed],
  ['local', 'Local-only', f => f.local],
  ['stale', 'Stale build folders', f => f.stale],
  ['all', 'All', () => true],
];
const SORTS = {
  name: r => r.name.toLowerCase(),
  age: ageDays,
  changes: r => r.changes ?? -1,
  branches: r => r.localOnly.length + r.unpushed.length + (r.hasRemote ? 0 : 1),
  nm: buildBytes,
};

function bytes(n) {
  if (n == null) return '';
  const u = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return `${n.toFixed(n < 10 && i ? 1 : 0)} ${u[i]}`;
}
function ago(t) {
  if (!t) return '';
  const d = (Date.now() - t) / DAY;
  if (d < 1 / 24) return 'just now';
  if (d < 1) return `${Math.round(d * 24)}h ago`;
  if (d < 45) return `${Math.round(d)}d ago`;
  if (d < 365) return `${Math.round(d / 30)} mo ago`;
  return `${(d / 365).toFixed(1)} yr ago`;
}

function render() {
  if (!data) return;
  const hidden = new Set(data.ignored);
  const hiddenRepos = data.repos.filter(r => hidden.has(r.path));
  const repos = data.repos.filter(r => !hidden.has(r.path));
  const withFlags = repos.map(r => [r, flags(r)]);

  // meta + progress
  $('meta').textContent = `${data.drives.join('  ')}` + (data.finishedAt && !data.scanning ? ` · scanned ${ago(data.finishedAt)}` : '');
  $('progress').hidden = !data.scanning;
  $('rescan').disabled = data.scanning;
  $('rescan').textContent = data.scanning ? 'Scanning…' : 'Rescan';
  $('pcount').textContent = data.dirsScanned.toLocaleString();
  $('prepos').textContent = (data.found ?? 0).toLocaleString();
  $('ppath').textContent = data.current;

  // summary
  const count = fn => withFlags.filter(([, f]) => fn(f)).length;
  const staleNm = withFlags.filter(([, f]) => f.stale);
  const staleBytes = staleNm.reduce((s, [r]) => s + buildBytes(r), 0);
  const allNm = repos.reduce((s, r) => s + buildBytes(r), 0);
  const attention = count(FILTERS[0][2]);
  const reasons = [['dirty', 'with uncommitted changes'], ['unpushed', 'with unpushed commits'], ['local', 'with local-only branches'], ['stash', 'with stashes']]
    .map(([k, label]) => [k, label, count(FILTERS.find(([fk]) => fk === k)[2])]).filter(([, , n]) => n)
    .map(([k, label, n]) => `<button class="link" data-filter="${k}">${n} ${label}</button>`);
  const list = reasons.length > 1 ? `${reasons.slice(0, -1).join(', ')} and ${reasons.at(-1)}` : reasons[0];
  $('summary').innerHTML = `<div>
      <div class="head">${attention
        ? `<b style="color:var(--rust)">${attention}</b> of ${repos.length} repositories need attention.`
        : `All ${repos.length} repositories are committed and pushed.`}</div>
      ${list ? `<div class="sub">${list}.</div>` : ''}
    </div>
    <div class="aside sub">${bytes(allNm) || '0 B'} in build folders${staleNm.length
      ? `<br><button class="link" data-filter="stale">${bytes(staleBytes)} in ${staleNm.length} stale repo${staleNm.length === 1 ? '' : 's'}</button> (untouched ${STALE_DAYS}+ days)` : ''}</div>`;

  // filter chips
  const chip = (k, label, n) =>
    `<button class="chip${n ? '' : ' zero'}" data-filter="${k}" aria-pressed="${k === filter}">${label}<span class="n">${n}</span></button>`;
  $('filters').innerHTML = FILTERS.map(([k, label, fn]) => chip(k, label, count(fn))).join('') + chip('hidden', 'Hidden', hiddenRepos.length);

  // sort arrows
  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.querySelector('.arrow')?.remove();
    th.removeAttribute('aria-sort');
    if (th.dataset.sort !== sort.key) return;
    th.setAttribute('aria-sort', sort.dir > 0 ? 'ascending' : 'descending');
    th.insertAdjacentHTML('beforeend', `<span class="arrow">${sort.dir > 0 ? '↑' : '↓'}</span>`);
  });
  const link = (attrs, label, title) => `<button class="link" ${attrs}${title ? ` title="${title}"` : ''}>${label}</button>`;

  // rows
  const showHidden = filter === 'hidden';
  const fn = showHidden ? () => true : FILTERS.find(([k]) => k === filter)[2];
  const needle = q.toLowerCase();
  const key = SORTS[sort.key];
  const rows = (showHidden ? hiddenRepos.map(r => [r, flags(r)]) : withFlags)
    .filter(([r, f]) => fn(f) && (!needle || r.path.toLowerCase().includes(needle)))
    .sort(([a], [b]) => {
      const x = key(a), y = key(b);
      return (x < y ? -1 : x > y ? 1 : 0) * sort.dir;
    });

  $('rows').innerHTML = rows.length ? rows.map(([r, f]) => `
    <tr>
      <td>
        <div class="name">${esc(r.name)}<span class="branch mono" title="Current branch">${esc(r.branch ?? '—')}</span>${r.hasRemote ? '' : '<span class="b-bad">no remote</span>'}</div>
        <div class="sub mono path">${esc(r.path).replace(/[\\/]/g, '$&<wbr>')}</div>
      </td>
      <td data-label="Last commit" title="${r.lastCommit ? esc(new Date(r.lastCommit.at).toLocaleString()) : ''}">
        ${r.lastCommit ? `<div class="num">${ago(r.lastCommit.at)}</div><div class="sub msg" title="${esc(r.lastCommit.message)}">${esc(r.lastCommit.message)}</div>` : '<span class="muted">no commits</span>'}
      </td>
      <td data-label="Uncommitted" class="num${r.changes === 0 && !f.stash ? ' nil' : ''}">${r.changes == null ? '<span class="muted">error</span>'
        : f.dirty ? `<span class="badge b-warn">${r.changes} file${r.changes === 1 ? '' : 's'}</span>${r.untracked ? `<div class="sub">${r.untracked} untracked</div>` : ''}${
          r.changedAt ? `<div class="sub" title="Newest change: ${esc(new Date(r.changedAt).toLocaleString())}">last edit ${ago(r.changedAt)}</div>` : ''}`
        : '<span class="muted">clean</span>'}${
        f.stash ? `<div><span class="badge b-info" title="git stash list">${r.stashes} stash${r.stashes === 1 ? '' : 'es'}</span></div>` : ''}</td>
      <td data-label="Unpushed" class="${f.unpushed || r.localOnly.length ? '' : 'nil'}">${r.unpushed.map(b => `<span class="badge b-info mono" title="${b.ahead} commit(s) not pushed">${esc(b.name)} ↑${b.ahead}</span>`).join('')}${
        r.localOnly.map(n => `<span class="badge b-bad mono" title="No upstream branch">${esc(n)}</span>`).join('')}${
        !f.unpushed && !r.localOnly.length ? '<span class="muted">—</span>' : ''}</td>
      <td data-label="Build folders" class="num${r.buildDirs.length ? '' : ' nil'}">${r.buildDirs.length ? r.buildDirs.map(d => `<div><span class="mono">${esc(d.name)}</span> ${bytes(d.bytes)}${
        f.stale ? ' <span class="badge b-warn">stale</span>' : ''}<button class="link danger" data-clean="${esc(d.name)}" data-path="${esc(r.path)}" data-size="${bytes(d.bytes)}">Delete</button></div>`).join('')
        : '<span class="muted">—</span>'}</td>
      <td class="actions">${link(`data-open="${esc(r.path)}"`, 'Open', 'Open folder')}${link(`data-code="${esc(r.path)}"`, 'Code', 'Open in VS Code')}${
          link(`data-refresh="${esc(r.path)}"`, 'Refresh', 'Re-check just this repo')}${link(`data-copy="${esc(r.path)}"`, 'Copy', 'Copy path')}${
          link(`data-hide="${esc(r.path)}" data-hidden="${showHidden}"`, showHidden ? 'Unhide' : 'Hide')}</td>
    </tr>`).join('')
    : `<tr><td colspan="6" class="empty">${data.scanning && !repos.length ? 'Looking for repositories…'
      : needle ? `<b>No repository matches “${esc(q)}”.</b>Try part of the folder name or path.`
      : filter === 'hidden' ? '<b>No hidden repositories.</b>Hide one from its row to keep it out of every list.'
      : `${filter === 'attention' ? '<b>Nothing needs attention.</b>Every repository is committed, pushed and free of stashes.' : '<b>Nothing here.</b>No repository matches this filter.'}${filter !== 'all' && repos.length ? `<div><button class="link" data-filter="all">Show all ${repos.length}</button></div>` : ''}`}</td></tr>`;
}

async function poll() {
  try { data = await (await fetch('/api/state')).json(); render(); } catch {}
  if (!data || data.scanning) setTimeout(poll, 1000);
}

const post = (url, body) => fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) });

$('rescan').onclick = async () => { await post('/api/scan'); poll(); };
$('q').oninput = e => { q = e.target.value; render(); };
const pickFilter = e => { const b = e.target.closest('[data-filter]'); if (b) { filter = b.dataset.filter; render(); } };
$('filters').onclick = $('summary').onclick = pickFilter;
let noticeTimer;
const notify = msg => {
  $('notice').textContent = msg;
  $('notice').hidden = false;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { $('notice').hidden = true; }, 6000);
};
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.target.closest('input, textarea')) { e.preventDefault(); $('q').focus(); }
  if (e.key === 'Escape' && e.target === $('q') && q) { $('q').value = q = ''; render(); }
});
const thead = document.querySelector('thead');
thead.onclick = e => {
  const th = e.target.closest('th[data-sort]');
  if (!th) return;
  sort = th.dataset.sort === sort.key ? { key: sort.key, dir: -sort.dir } : { key: th.dataset.sort, dir: th.dataset.sort === 'name' ? 1 : -1 };
  render();
};
thead.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); thead.onclick(e); } };
$('rows').onclick = async e => {
  pickFilter(e);
  const open = e.target.closest('[data-open]');
  const copy = e.target.closest('[data-copy]');
  const hide = e.target.closest('[data-hide]');
  const code = e.target.closest('[data-code]');
  const refresh = e.target.closest('[data-refresh]');
  const clean = e.target.closest('[data-clean]');
  if (open) post('/api/open', { path: open.dataset.open });
  if (code) {
    const res = await post('/api/code', { path: code.dataset.code });
    if (!res.ok) notify((await res.json()).error);
  }
  if (refresh) {
    refresh.disabled = true;
    refresh.textContent = 'Checking…';
    await post('/api/refresh', { path: refresh.dataset.refresh });
    poll();
  }
  if (clean) {
    const { path, clean: name, size } = clean.dataset;
    if (!confirm(`Permanently delete ${name} (${size}) in\n${path}?\n\nThis cannot be undone; reinstall or rebuild to get it back.`)) return;
    clean.disabled = true;
    clean.textContent = 'Deleting…';
    const res = await post('/api/clean', { path, name });
    if (!res.ok) notify((await res.json()).error);
    poll();
  }
  if (hide) {
    const res = await post('/api/ignore', { path: hide.dataset.hide, hide: hide.dataset.hidden !== 'true' });
    if (res.ok) { data.ignored = (await res.json()).ignored; render(); }
  }
  if (copy) {
    const ok = await navigator.clipboard.writeText(copy.dataset.copy).then(() => true, () => false);
    if (!ok) return notify('Could not reach the clipboard.');
    copy.textContent = 'Copied';
    setTimeout(() => { copy.textContent = 'Copy'; }, 1200);
  }
};
setInterval(() => !data?.scanning && render(), 60_000); // keep "x ago" fresh
poll();
</script>
</body>
</html>
